<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Top stripe: Red -->
  <rect width="900" height="200" fill="#d81e05" />
  <!-- Middle stripe: White -->
  <rect y="200" width="900" height="200" fill="#ffffff" />
  <!-- Bottom stripe: Left red (Austria), right green (Hungary) -->
  <rect y="400" width="450" height="200" fill="#d81e05" />
  <rect x="450" y="400" width="450" height="200" fill="#388d5e" />
  <!-- Austrian Coat of Arms (left) -->
  <g transform="translate(225, 270) scale(0.7)">
    <rect x="-50" y="-70" width="100" height="140" rx="20" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <rect x="-50" y="-30" width="100" height="60" fill="#d81e05" />
    <path d="M-60,-80 L0,-110 L60,-80 Z" fill="#ffd700" stroke="#000000" stroke-width="3" />
  </g>
  <!-- Hungarian Coat of Arms (right) -->
  <g transform="translate(675, 270) scale(0.7)">
    <rect x="-50" y="-70" width="100" height="140" rx="20" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <rect x="-50" y="0" width="100" height="70" fill="#388d5e" />
    <path d="M-60,-80 L0,-110 L60,-80 Z" fill="#ffd700" stroke="#000000" stroke-width="3" />
  </g>
</svg>
