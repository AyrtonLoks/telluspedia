services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: telluspedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: telluspedia
      POSTGRES_PASSWORD: telluspedia_secret
      POSTGRES_DB: telluspedia_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telluspedia -d telluspedia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telluspedia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  data-pipeline:
    build:
      context: ./services/data-pipeline
      dockerfile: Dockerfile
    container_name: telluspedia-data-pipeline
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://telluspedia:telluspedia_secret@postgres:5432/telluspedia_db?schema=public"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
