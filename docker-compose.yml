services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: telluspedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: telluspedia
      POSTGRES_PASSWORD: telluspedia_secret
      POSTGRES_DB: telluspedia_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U telluspedia -d telluspedia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telluspedia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  data-pipeline:
    build:
      context: ./services/data-pipeline
      dockerfile: Dockerfile
    container_name: telluspedia-data-pipeline
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://telluspedia:telluspedia_secret@postgres:5432/telluspedia_db?schema=public"
      REDIS_URL: "redis://redis:6379/0"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: telluspedia-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://telluspedia:telluspedia_secret@postgres:5432/telluspedia_db?schema=public"
      REDIS_URL: "redis://redis:6379/0"
      DATA_PIPELINE_URL: "http://data-pipeline:8000"
      STUDIES_TRUST_PROXY: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-pipeline:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
