packages:
  - 'apps/*'
  - 'packages/*'

# Next 15 pins a PostCSS release below the patched security range.
overrides:
  'next@15.5.29>postcss': 8.5.30

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  '@react-three/drei@10.7.9': patches/@react-three__drei@10.7.9.patch
