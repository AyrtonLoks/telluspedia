name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: '12.9.1'
          runtime: node@22
          cache: true
          require-lockfile: true
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Desktop smoke and visual regression
        run: pnpm test:e2e

  data-pipeline:
    name: Data Pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/data-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.21'
          python-version: '3.12'
          working-directory: services/data-pipeline
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test
        run: uv run --no-sync pytest
